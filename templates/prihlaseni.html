{% extends "base.html" %}
{% block title %}Přihlášení | KAPy{% endblock %}
{% block content %}

<div style="display: flex; justify-content: center; align-items: center; min-height: 75vh; padding: 20px;">
    
    <div class="card" style="width: 100%; max-width: 420px; padding: 2.5rem 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08), 0 4px 6px rgba(0,0,0,0.04); background-color: #ffffff; text-align: center; border: 1px solid #f3f4f6;">
        
        <!-- Minimalistická hlavička -->
        <h2 style="color: #111827; margin-bottom: 1.75rem; font-size: 1.75rem;">Přihlášení 🔐</h2>
        
        <form id="prihlasovaci-form" style="text-align: left;">
            <div style="margin-bottom: 1.25rem;">
                <label for="email" style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #374151; font-size: 0.9rem;">E-mail</label>
                <input type="email" id="email" name="email" placeholder="email@example.com" required 
                       style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font-size: 1rem; transition: border-color 0.2s, box-shadow 0.2s; outline: none;"
                       onfocus="this.style.borderColor='#3b82f6'; this.style.boxShadow='0 0 0 3px rgba(59, 130, 246, 0.1)';"
                       onblur="this.style.borderColor='#d1d5db'; this.style.boxShadow='none';">
            </div>
            
            <div style="margin-bottom: 1.75rem;">
                <label for="heslo" style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #374151; font-size: 0.9rem;">Heslo</label>
                <input type="password" id="heslo" name="heslo" placeholder="••••••••" required 
                       style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font-size: 1rem; transition: border-color 0.2s, box-shadow 0.2s; outline: none;"
                       onfocus="this.style.borderColor='#3b82f6'; this.style.boxShadow='0 0 0 3px rgba(59, 130, 246, 0.1)';"
                       onblur="this.style.borderColor='#d1d5db'; this.style.boxShadow='none';">
            </div>
            
            <button type="submit" id="prihl-tlacitko" class="btn" 
                    style="width: 100%; padding: 0.75rem; background-color: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background-color 0.2s;"
                    onmouseover="this.style.backgroundColor='#2563eb'"
                    onmouseout="this.style.backgroundColor='#3b82f6'">
                Přihlásit se
            </button>
        </form>
        
        <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #e5e7eb;">
            <p style="font-size: 0.9rem; color: #4b5563; margin: 0;">Ještě nemáte účet? <a href="{{ url_for('registrace') }}" style="color: #3b82f6; text-decoration: none; font-weight: 600;">Zaregistrujte se</a></p>
        </div>

        <div style="margin-top: 2rem; font-size: 0.8rem; color: #9ca3af;">
            <p style="margin: 0;">&copy; 2026 Karel Nechvíl</p>
            <p style="margin: 0.4rem 0 0 0;">
                <a href="https://github.com/nechvilk/KAPy" target="_blank" style="color: #6b7280; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: color 0.2s;" onmouseover="this.style.color='#374151'" onmouseout="this.style.color='#6b7280'">
                    <svg height="14" width="14" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                    </svg>
                    GitHub
                </a>
            </p>
        </div>
        
    </div>
</div>

{% endblock %}
